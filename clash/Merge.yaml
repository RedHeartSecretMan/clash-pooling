# ===========================================================================
# 全局扩展覆写配置（对所有订阅生效）
# ===========================================================================
# 这里放与订阅无关的覆写：
#   profile.store-selected   记住在界面里手动选的节点和分组
#   dns                      自定义解析策略（默认不配置，见下方示例）
#
# 执行顺序（Verge 官方）
#   订阅原文 → 应用设置 → 全局扩展配置（本文件）→ 全局扩展脚本
#   → 订阅扩展配置 → 订阅扩展脚本 → 应用设置回写
# 本文件早于全局扩展脚本生效。
#
# 本机私有配置请放到 clash/local/Merge.yaml（已被 .gitignore 排除），
# 存在时 clashctl sync 会用它替代本文件。
# ===========================================================================

profile:
  store-selected: true

# ---------------------------------------------------------------------------
# 解析策略示例（默认注释掉，不要直接套用到真实环境）
#
# 用途：指定域名的解析走专用 DNS，并且让直连流量也遵循这套策略。
# 要点：direct-nameserver-follow-policy 必须为 true，否则直连解析会绕过
#       nameserver-policy，指定域名的策略不会生效。
#
# dns:
#   fake-ip-filter:            # 这些域名不做 fake-ip，保留真实解析结果
#     - '+.example.com'
#   direct-nameserver:
#     - system                 # 直连流量用系统解析器
#   direct-nameserver-follow-policy: true
#   nameserver-policy:         # 指定域名交给专用 DNS
#     '+.example.com':
#       - 192.0.2.10
# ---------------------------------------------------------------------------
